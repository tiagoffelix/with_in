<header id="header" class="header" [class.scrolled]="isScrolled">
  <div class="container">
    <div class="header-content">
      <a [routerLink]="['/']" [fragment]="'home'" class="logo">
        <img src="assets/logo.png" alt="With.in logo" loading="lazy" decoding="async" />
      </a>
      <nav class="nav-desktop">
        <ul class="nav-list">
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'services'">Serviços</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'home'">Missão</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'team'">Equipa</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'testemunhos'">Testemunhos</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'contact'">Contacto</a></li>
        </ul>
      </nav> <!-- nav-desktop -->
      <!-- Mobile menu toggle -->
      <button type="button" class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <!-- Mobile navigation menu -->
      <nav class="nav-mobile" [class.open]="isMobileMenuOpen">
        <ul class="nav-list-mobile">
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'services'" (click)="toggleMobileMenu()">Serviços</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'home'" (click)="toggleMobileMenu()">Missão</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'team'" (click)="toggleMobileMenu()">Equipa</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'testemunhos'" (click)="toggleMobileMenu()">Testemunhos</a></li>
          <li><a class="nav-link" [routerLink]="['/']" [fragment]="'contact'" (click)="toggleMobileMenu()">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
