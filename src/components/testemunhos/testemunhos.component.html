<section id="testemunhos" class="testemunhos section">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">TESTEMUNHOS</h2>
    </div>
    <div class="testemunhos-grid">
        <img
          class="testimonial-image"
          *ngFor="let t of testimonials"
          [src]="'/assets/testemunhos/' + t + '.png'"
          [alt]="'Testemunho ' + t"
          loading="lazy"
        />
    </div>  <!-- end of testemunhos-grid -->
    <div class="feedback-btn text-center" style="margin-top: var(--spacing-lg);">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfCabr7mFVaAjfURRKpdbN-O9eNiIzFruTTHK-x27jiTDAqvw/viewform" target="_blank" class="btn btn-primary">Deixa o teu Feedback</a>
    </div>
  </div>
</section>
