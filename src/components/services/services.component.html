<section id="services" class="services section">
  <!-- Full-width banner image -->
  <img src="/assets/Frase.PNG" alt="Nossos Serviços" class="services-banner" />
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Os Nossos Serviços</h2>
    </div>

    <div class="services-grid">
      <div 
        class="service-card"
        *ngFor="let service of services; trackBy: trackByService"
      >
        <img
          class="service-img"
          [src]="'/assets/services/' + service.id + '.png'"
          [alt]="service.name"
        />
        
        <div class="service-content">
          <h3 class="service-name">{{ service.name }}</h3>
          
          <!-- Open details in modal -->
          <button class="btn btn-secondary" (click)="openModal(service)">
            Saber mais
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- Service Details Modal -->
  <div class="modal-overlay" *ngIf="selectedService" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="modal-close" (click)="closeModal()">×</button>
      <div class="modal-header">
        <h3 class="modal-title">{{ selectedService.name }}</h3>
      </div>
      <div class="modal-body">
        <p class="service-description">{{ selectedService.description }}</p>
        <p class="service-price" *ngIf="selectedService.id === 'individual-therapy'">Valor: 50€</p>
        <p class="service-price" *ngIf="selectedService.id === 'couple-therapy'">Valor: 80€</p>
        <p class="service-price" *ngIf="selectedService.id === 'career-coaching'">Valor: 70€</p>
        <div class="service-actions">
          <button class="btn btn-primary" (click)="scheduleService(selectedService.name)">Marca a tua sessão</button>
        </div>
      </div>
    </div>
  </div>
</section>
